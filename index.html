<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JOHN: ROGUE COMMANDO - Retro Arcade Shooter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #141724 0%, #08090e 100%);
      color: #e0e6ed;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 10px;
    }

    .game-wrapper {
      position: relative;
      background: #000;
      border: 4px solid #2e384d;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(78, 140, 255, 0.2);
      overflow: hidden;
      max-width: 100%;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0d1117;
      cursor: crosshair;
    }

    /* CRT Scanline & Glow Overlay */
    .crt-overlay {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 4px, 6px 100%;
      opacity: 0.6;
      transition: opacity 0.3s;
    }

    .crt-overlay.disabled {
      display: none;
    }

    .dashboard {
      width: 100%;
      max-width: 880px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
    }

    .controls-panel {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      background: #21262d;
      border: 1px solid #484f58;
      color: #58a6ff;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button.ui-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    button.ui-btn:hover {
      background: #30363d;
      border-color: #8b949e;
      color: #fff;
    }

    button.ui-btn:active {
      transform: scale(0.96);
    }

    /* Mobile virtual touch controls */
    .mobile-controls {
      display: none;
      width: 100%;
      max-width: 880px;
      margin-top: 10px;
      justify-content: space-between;
      touch-action: none;
    }

    @media (max-width: 860px) {
      .mobile-controls {
        display: flex;
      }
    }

    .dpad, .action-btns {
      display: flex;
      gap: 8px;
    }

    .touch-btn {
      width: 58px;
      height: 58px;
      background: rgba(48, 54, 61, 0.7);
      border: 2px solid #58a6ff;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .touch-btn:active {
      background: rgba(88, 166, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="480"></canvas>
    <div id="crtOverlay" class="crt-overlay"></div>
  </div>

  <div class="dashboard">
    <div class="controls-panel">
      <span><span class="badge">A / D</span> Move</span>
      <span><span class="badge">W</span> Jump</span>
      <span><span class="badge">S</span> Crouch</span>
      <span><span class="badge">J / Click</span> Shoot</span>
      <span><span class="badge">R</span> Reload</span>
    </div>
    <div class="btn-group">
      <button class="ui-btn" id="btnSound">🔊 Sound: ON</button>
      <button class="ui-btn" id="btnCrt">📺 CRT: ON</button>
      <button class="ui-btn" id="btnFullscreen">⛶ Fullscreen</button>
    </div>
  </div>

  <div class="mobile-controls">
    <div class="dpad">
      <div class="touch-btn" id="touchLeft">◀</div>
      <div class="touch-btn" id="touchDown">▼</div>
      <div class="touch-btn" id="touchRight">▶</div>
    </div>
    <div class="action-btns">
      <div class="touch-btn" id="touchReload" style="border-color:#f0883e;">⟳</div>
      <div class="touch-btn" id="touchJump" style="border-color:#3fb950;">▲</div>
      <div class="touch-btn" id="touchShoot" style="border-color:#f85149; background:rgba(248,81,73,0.3);">💥</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
